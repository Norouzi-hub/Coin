name: تست‌ها
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      # index.html باید همان خروجی ساخت از src/ باشد
      - run: node tools/build.js --check
      - run: bash tests/run.sh
        env:
          PAR: 3
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: /tmp/signaldesk-tests
